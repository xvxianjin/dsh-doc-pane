name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install editor build dependencies
        run: npm --prefix tools/editor ci
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run
